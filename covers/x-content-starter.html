<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="cover.css">
<style>
  .thing { width: 900px; padding: 50px 56px 42px; background: #15171a; color: #f2f2f0; }
  .author { display: flex; gap: 22px; align-items: center; }
  .avatar { width: 88px; height: 88px; font-size: 32px; background: #e4c8ba; color: #15171a; }
  .author b { display: block; font-size: 30px; }
  .author span { display: block; font-size: 23px; color: #8b8f94; margin-top: 4px; }
  .text { font-size: 54px; line-height: 1.22; margin-top: 34px; letter-spacing: -0.5px; }
  .text em { font-style: normal; color: #e9a58c; }
  .quote { margin-top: 30px; padding: 24px 28px 26px; border: 1.5px solid #2f3336; border-radius: 18px; }
  .quote .who { display: flex; gap: 12px; align-items: center; font-size: 22px; color: #8b8f94; }
  .quote .who i { width: 36px; height: 36px; border-radius: 50%; background: #3a3f45; }
  .quote .who b { color: #f2f2f0; font-weight: 600; }
  .quote p { font-size: 28px; line-height: 1.35; margin-top: 12px; color: #d9dadb; }
  .stats { display: flex; gap: 48px; margin-top: 40px; padding-top: 24px; border-top: 1.5px solid #2c2f33; font-size: 23px; color: #8b8f94; }
  .stats b { color: #f2f2f0; font-weight: 600; }
</style>
</head>
<body class="clay">
  <div class="grain"></div>
  <div class="thing">
    <div class="author"><div class="avatar">ML</div><div><b>Maya Lin</b><span>@mayabuilds</span></div></div>
    <p class="text">ChatGPT just got better memory. <em>It still can’t read your notes.</em></p>
    <div class="quote">
      <div class="who"><i></i><b>AI News</b><span>@ainews · 2h</span></div>
      <p>ChatGPT can now remember more of your past conversations.</p>
    </div>
    <div class="stats"><span><b>4.2K</b> views</span><span><b>32</b> reposts</span><span><b>214</b> likes</span></div>
  </div>
</body>
</html>
